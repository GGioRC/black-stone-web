<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Black Stone · The Maze</title>
  <meta name="description" content="Cámaras de The Maze con tus propios dados, y las tablas, criaturas, ítems y materiales del libro.">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="app-header">
    <p class="app-name">Black Stone · The Maze</p>
    <nav id="nav" class="app-nav" aria-label="Black Stone"></nav>
    <div id="lang" class="lang-switch" role="group" aria-label="Idioma / Language"></div>
  </header>
  <main id="main" class="app-main" tabindex="-1"></main>
  <script type="module" src="js/main.js"></script>
  <script>
    // Si la app no arranca (archivos guardados de otra versión), ofrece repararla: borra lo guardado y recarga.
    setTimeout(function () {
      if (document.documentElement.dataset.ready) return;
      var main = document.getElementById("main");
      main.innerHTML = '<p class="empty">La app no cargó. · It did not load.</p><div class="chamber-actions"><button type="button" class="primary" id="repair">Reparar · Repair</button></div>';
      document.getElementById("repair").onclick = async function () {
        try {
          if (navigator.serviceWorker) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
          if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
        } catch (e) { /* recargar igual */ }
        location.reload();
      };
    }, 8000);
  </script>
</body>
</html>
